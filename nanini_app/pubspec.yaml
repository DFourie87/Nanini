name: nanini_app
description: "Nanini Boerdery farm management app"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.3

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Backend — same Supabase project as the existing web app
  supabase_flutter: ^2.8.0

  # Fonts matching the web app's brand (Oswald + Inter)
  google_fonts: ^6.2.1

  # Local-only prefs: manager-mode password hash, small UI state
  shared_preferences: ^2.3.3

  # Formatting (currency, dates)
  intl: ^0.20.2

  # PDF generation (delivery notes, payslips) + printing/sharing
  pdf: ^3.11.1
  printing: ^5.13.4

  # CSV import/export (Hours kg-picking import, Sales export)
  csv: ^6.0.0

  # Excel (.xlsx) import — Haaskraal hours uploaded at payroll time
  excel: ^4.0.6
  file_picker: ^8.1.3

  # Charts (Delivery "Fields" pie chart)
  fl_chart: ^0.69.2

  # Map picker (Truck booking location pin) — OpenStreetMap, no API key
  flutter_map: ^7.0.2
  latlong2: ^0.9.1

  # Photo capture (diesel delivery-slip / invoice photos)
  image_picker: ^1.1.2

  # Sharing generated files (CSV/PDF)
  share_plus: ^10.1.3

  # Opening uploaded files (hunting exemption certificates) in the device's
  # own viewer/browser
  url_launcher: ^6.3.1

  # UUID generation for client-side temp IDs where needed
  uuid: ^4.5.1

  # Password hashing for local manager-mode gate
  crypto: ^3.0.6

  # Lightweight DI for cross-cutting singletons (Session, not business data —
  # see docs/ARCHITECTURE.md)
  provider: ^6.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # Generates the Android/iOS launcher icons from assets/images/icon-512.png
  flutter_launcher_icons: ^0.14.2

flutter:
  uses-material-design: true

  assets:
    - assets/images/hub-logo.jpg
    - assets/images/hub-logo-print.png
    - assets/images/icon-192.png
    - assets/images/icon-512.png
    - assets/images/app-icon-square.png

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/app-icon-square.png"
  min_sdk_android: 21
