name: Build Flutter APK

on:
  push:
    branches: [main]
    paths:
      - 'nanini_app/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

# Needed so the "Publish install link" step below can create/update a
# release with the GITHUB_TOKEN.
permissions:
  contents: write

# Only the newest push matters (it's what the install links serve), so a new
# push cancels a build still running -- several at once used to trip the
# Maven servers' "429 Too Many Requests" and fail.
concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # For "Publish to Nanini-releases" (empty when the secret isn't set).
    env:
      RELEASES_TOKEN: ${{ secrets.RELEASES_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      # Keep Gradle's downloads between runs: faster, and far fewer requests
      # to the Maven servers.
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('nanini_app/android/**/*.gradle*', 'nanini_app/android/gradle/wrapper/gradle-wrapper.properties', 'nanini_app/pubspec.lock') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Install dependencies
        working-directory: nanini_app
        run: flutter pub get

      # Sign every build with the same key (from repo secrets) so a new APK
      # installs as an update over the old one. Without the secrets the
      # build still works, but uses a throwaway debug key.
      - name: Set up release signing key
        working-directory: nanini_app/android
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::ANDROID_KEYSTORE_BASE64 secret not set -- signing with a temporary debug key, so this APK won't install over an existing one."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > app/upload-keystore.jks
          {
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyPassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "storeFile=upload-keystore.jks"
          } > key.properties

      # Two apps from one project (Android product flavors): the hub, and
      # Nanini Capture -- the offline capturing app for workers' phones.
      # Output names are kept stable so the install links never change.
      # Each build is stamped with the run number: Android's version code
      # (so a newer build always installs over an older one) and APP_BUILD,
      # which the in-app update button compares with version.json below.
      # Phones only (32- and 64-bit ARM): leaving out the x86_64 copy that
      # only emulators/Chromebooks use makes each download about a third
      # smaller over the farms' weak signal.
      - name: Build release APKs
        working-directory: nanini_app
        env:
          BUILD: ${{ github.run_number }}
        run: |
          flutter build apk --release --flavor hub --target-platform android-arm,android-arm64 --build-number=$BUILD --dart-define=APP_BUILD=$BUILD
          flutter build apk --release --flavor capture -t lib/main_capture.dart --target-platform android-arm,android-arm64 --build-number=$BUILD --dart-define=APP_BUILD=$BUILD
          cd build/app/outputs/flutter-apk
          cp app-hub-release.apk app-release.apk
          cp app-capture-release.apk nanini-capture.apk
          echo "{\"build\": $BUILD}" > version.json

      - name: Upload APKs (build artifact, for debugging this workflow)
        uses: actions/upload-artifact@v4
        with:
          name: nanini-app-apk
          path: |
            nanini_app/build/app/outputs/flutter-apk/app-release.apk
            nanini_app/build/app/outputs/flutter-apk/nanini-capture.apk

      # actions/upload-artifact requires a GitHub login and expires after ~90
      # days, so it's no good as a link for end users to install from. This
      # publishes the same APK to a "latest" GitHub Release instead, whose
      # asset URL is public and permanent -- see docs/INSTALL.md.
      - name: Publish install link
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest build
          body: Automatically built from the latest push to main.
          make_latest: true
          # version.json last: apps only see the new build once its APKs
          # are up.
          files: |
            nanini_app/build/app/outputs/flutter-apk/app-release.apk
            nanini_app/build/app/outputs/flutter-apk/nanini-capture.apk
            nanini_app/build/app/outputs/flutter-apk/version.json

      # The same downloads on the public Nanini-releases repository (builds
      # only, no code), so this code repository can be private. Needs the
      # RELEASES_TOKEN secret (a token allowed to write Nanini-releases);
      # without it this step is skipped.
      - name: Publish to Nanini-releases
        if: ${{ env.RELEASES_TOKEN != '' }}
        uses: softprops/action-gh-release@v2
        with:
          repository: DFourie87/Nanini-releases
          token: ${{ secrets.RELEASES_TOKEN }}
          tag_name: latest
          name: Latest build
          body: Nanini Boerdery apps -- built automatically from the latest change.
          make_latest: true
          files: |
            nanini_app/build/app/outputs/flutter-apk/app-release.apk
            nanini_app/build/app/outputs/flutter-apk/nanini-capture.apk
            nanini_app/build/app/outputs/flutter-apk/version.json

  # The hub on a Windows PC (office): the same app as a desktop program,
  # zipped onto the same "latest" release -- see docs/INSTALL.md. After the
  # APKs, so they're never held up by it.
  windows:
    needs: build
    runs-on: windows-latest
    env:
      RELEASES_TOKEN: ${{ secrets.RELEASES_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Build the Windows app
        working-directory: nanini_app
        env:
          BUILD: ${{ github.run_number }}
        run: |
          flutter pub get
          flutter build windows --release --build-number=$env:BUILD --dart-define=APP_BUILD=$env:BUILD
          Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath nanini-hub-windows.zip

      - name: Publish the Windows download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest build
          body: Automatically built from the latest push to main.
          make_latest: true
          files: nanini_app/nanini-hub-windows.zip

      - name: Publish the Windows download to Nanini-releases
        if: ${{ env.RELEASES_TOKEN != '' }}
        uses: softprops/action-gh-release@v2
        with:
          repository: DFourie87/Nanini-releases
          token: ${{ secrets.RELEASES_TOKEN }}
          tag_name: latest
          name: Latest build
          body: Nanini Boerdery apps -- built automatically from the latest change.
          make_latest: true
          files: nanini_app/nanini-hub-windows.zip
