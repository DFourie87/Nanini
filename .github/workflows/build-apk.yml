name: Build Flutter APK

on:
  push:
    branches: [main]
    paths:
      - 'nanini_app/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

# Needed so the "Publish install link" step below can create/update a
# release with the GITHUB_TOKEN.
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install dependencies
        working-directory: nanini_app
        run: flutter pub get

      # Sign every build with the same key (from repo secrets) so a new APK
      # installs as an update over the old one. Without the secrets the
      # build still works, but uses a throwaway debug key.
      - name: Set up release signing key
        working-directory: nanini_app/android
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::ANDROID_KEYSTORE_BASE64 secret not set -- signing with a temporary debug key, so this APK won't install over an existing one."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > app/upload-keystore.jks
          {
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyPassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "storeFile=upload-keystore.jks"
          } > key.properties

      # Two apps from one project (Android product flavors): the hub, and
      # Nanini Capture -- the offline capturing app for workers' phones.
      # Output names are kept stable so the install links never change.
      # Each build is stamped with the run number: Android's version code
      # (so a newer build always installs over an older one) and APP_BUILD,
      # which the in-app update button compares with version.json below.
      - name: Build release APKs
        working-directory: nanini_app
        env:
          BUILD: ${{ github.run_number }}
        run: |
          flutter build apk --release --flavor hub --build-number=$BUILD --dart-define=APP_BUILD=$BUILD
          flutter build apk --release --flavor capture -t lib/main_capture.dart --build-number=$BUILD --dart-define=APP_BUILD=$BUILD
          cd build/app/outputs/flutter-apk
          cp app-hub-release.apk app-release.apk
          cp app-capture-release.apk nanini-capture.apk
          echo "{\"build\": $BUILD}" > version.json

      - name: Upload APKs (build artifact, for debugging this workflow)
        uses: actions/upload-artifact@v4
        with:
          name: nanini-app-apk
          path: |
            nanini_app/build/app/outputs/flutter-apk/app-release.apk
            nanini_app/build/app/outputs/flutter-apk/nanini-capture.apk

      # actions/upload-artifact requires a GitHub login and expires after ~90
      # days, so it's no good as a link for end users to install from. This
      # publishes the same APK to a "latest" GitHub Release instead, whose
      # asset URL is public and permanent -- see docs/INSTALL.md.
      - name: Publish install link
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest build
          body: Automatically built from the latest push to main.
          make_latest: true
          # version.json last: apps only see the new build once its APKs
          # are up.
          files: |
            nanini_app/build/app/outputs/flutter-apk/app-release.apk
            nanini_app/build/app/outputs/flutter-apk/nanini-capture.apk
            nanini_app/build/app/outputs/flutter-apk/version.json
