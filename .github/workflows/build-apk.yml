name: Build Flutter APK

on:
  push:
    branches: [main]
    paths:
      - 'nanini_app/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

# Needed so the "Publish install link" step below can create/update a
# release with the GITHUB_TOKEN.
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install dependencies
        working-directory: nanini_app
        run: flutter pub get

      # Sign every build with the same key (from repo secrets) so a new APK
      # installs as an update over the old one. Without the secrets the
      # build still works, but uses a throwaway debug key.
      - name: Set up release signing key
        working-directory: nanini_app/android
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::ANDROID_KEYSTORE_BASE64 secret not set -- signing with a temporary debug key, so this APK won't install over an existing one."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > app/upload-keystore.jks
          {
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyPassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "storeFile=upload-keystore.jks"
          } > key.properties

      - name: Build release APK
        working-directory: nanini_app
        run: flutter build apk --release

      - name: Upload APK (build artifact, for debugging this workflow)
        uses: actions/upload-artifact@v4
        with:
          name: nanini-app-apk
          path: nanini_app/build/app/outputs/flutter-apk/app-release.apk

      # actions/upload-artifact requires a GitHub login and expires after ~90
      # days, so it's no good as a link for end users to install from. This
      # publishes the same APK to a "latest" GitHub Release instead, whose
      # asset URL is public and permanent -- see docs/INSTALL.md.
      - name: Publish install link
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest build
          body: Automatically built from the latest push to main.
          make_latest: true
          files: nanini_app/build/app/outputs/flutter-apk/app-release.apk
