<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nanini Boerdery</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#C41A1E">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-512.png">
<meta name="apple-mobile-web-app-title" content="Nanini Boerdery">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#000000;
    --paper:#FFFFFF;
    --line:#E4D6C3;
    --rust:#EC1F24;
    --rust-dark:#C41A1E;
    --muted:#4A4A4A;
    --disabled-bg:#F0E7D8;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; font-family:'Inter',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    background:var(--paper); color:var(--ink);
    min-height:100vh;
  }
  header{
    display:flex; align-items:center; gap:16px;
    padding:24px 20px; border-bottom:1px solid var(--line);
  }
  header img{
    height:52px; width:52px; flex-shrink:0;
    object-fit:contain;
    background:#fff;
    border:1px solid var(--line);
    border-radius:10px;
    padding:4px;
  }
  header h1{ font-family:'Oswald',sans-serif; font-size:1.4rem; margin:0; line-height:1.25; font-weight:600; letter-spacing:0.01em; }
  header h1 span{ display:block; color:var(--rust); font-weight:800; }
  main{ padding:20px; max-width:640px; margin:0 auto; }
  .grid{ display:grid; grid-template-columns:repeat(2, 1fr); gap:14px; margin-top:8px; }
  a.tile, div.tile{
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:10px; padding:16px 10px; border:1px solid var(--line); border-radius:16px;
    text-decoration:none; color:var(--ink);
    background:var(--panel, #fff);
    box-shadow: 0 4px 16px rgba(36,23,18,0.08), 0 1px 3px rgba(36,23,18,0.06);
    aspect-ratio:1; text-align:center;
    transition: transform .12s ease, box-shadow .12s ease;
  }
  a.tile:active{ background:#F1F1F1; transform:translateY(1px); box-shadow: 0 1px 4px rgba(36,23,18,0.10); }
  .tile .emoji{ font-size:2.6rem; line-height:1; }
  .tile .info{ flex:none; }
  .tile .info .name{ font-family:'Oswald',sans-serif; font-weight:600; font-size:0.95rem; line-height:1.25; }
  .tile .info .desc{ color:var(--muted); font-size:0.78rem; margin-top:2px; }
  .tile .arrow{ display:none; }
  div.tile.disabled{ background:var(--disabled-bg); color:#999; border-color:var(--disabled-bg); }
  div.tile.disabled .info .name{ color:#999; }
  div.tile.disabled .emoji{ opacity:0.4; }
  .badge{
    font-size:0.7rem; font-weight:700; text-transform:uppercase;
    padding:3px 8px; border-radius:999px; background:var(--disabled-bg); color:#999;
    margin-left:8px;
  }
  footer{ text-align:center; color:var(--muted); font-size:0.8rem; padding:30px 20px; }
</style>
</head>
<body>
<header>
  <img src="hub-logo.jpg" alt="Nanini Boerdery">
  <h1>Nanini Boerdery</h1>
</header>
<main>
  <div class="grid">
    <a class="tile" href="diesel/">
      <div class="emoji">⛽</div>
      <div class="info">
        <div class="name">Diesel</div>
      </div>
      <div class="arrow">›</div>
    </a>

    <a class="tile" href="tuckshop/">
      <div class="emoji">🛒</div>
      <div class="info">
        <div class="name">Tuck Shop</div>
      </div>
      <div class="arrow">›</div>
    </a>

    <a class="tile" href="hours/">
      <div class="emoji">🕒</div>
      <div class="info">
        <div class="name">Employees</div>
      </div>
      <div class="arrow">›</div>
    </a>

    <a class="tile" href="delivery/">
      <div class="emoji">📦</div>
      <div class="info">
        <div class="name">Packaging</div>
      </div>
      <div class="arrow">›</div>
    </a>

    <a class="tile" href="sales/">
      <div class="emoji">📊</div>
      <div class="info">
        <div class="name">Sales</div>
      </div>
      <div class="arrow">›</div>
    </a>

    <a class="tile" href="employees/">
      <div class="emoji">🧑‍🌾</div>
      <div class="info">
        <div class="name">Employee List</div>
      </div>
      <div class="arrow">›</div>
    </a>

    <a class="tile" href="truck/">
      <div class="emoji">🚚</div>
      <div class="info">
        <div class="name">Truck</div>
      </div>
      <div class="arrow">›</div>
    </a>
  </div>
</main>
<footer>Nanini Boerdery</footer>
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js').catch(()=>{});
    });
  }
</script>
</body>
</html>
